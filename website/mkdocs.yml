# Course website. Build with:  python website/build.py
# The build copies the course files into website/_src and renders them; the
# repository itself stays the source of truth.
site_name: "From Python to AI"
site_description: "Free, self-paced AI/ML course: from Python to deployed ML and LLM apps, step by step with real data"
site_url: https://cloudops-one.github.io/training-ai-ml/
repo_url: https://github.com/cloudops-one/training-ai-ml
repo_name: cloudops-one/training-ai-ml
edit_uri: edit/main/
docs_dir: _src
site_dir: _site

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Light mode}
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
