# Builds the course website and publishes it to
# https://cloudops-one.github.io/training-ai-ml/ on every push to main that
# changes a page. Also runs on demand: GitHub > Actions > "Website" > Run workflow.
name: Website

on:
  push:
    branches: [main]
    paths: ["**.md", "website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: website/requirements.txt

      - name: Build site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: |
          pip install -r website/requirements.txt
          python website/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
